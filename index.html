<!DOCTYPE HTML>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>元素診断</title>
    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            background:#f3f5f9;
            color:#222;
            max-width:900px;
            margin:auto;
            padding:40px 20px 80px;
            line-height:1.6;
        }

        h1{
            text-align:center;
            margin-bottom:5px;
            font-size:2.2rem;
        }

        h3{
            text-align:center;
            color:#666;
            font-weight:500;
        }

        body>p:first-of-type{
            text-align:center;
            color:#888;
            margin-bottom:35px;
        }

        .question-block{
            background:white;
            border-radius:16px;
            padding:22px;
            margin-bottom:22px;
            box-shadow:0 8px 20px rgba(0,0,0,.08);
            display:flex;
            flex-wrap:wrap;
            gap:12px;
        }

        .question-label{
            flex-basis:100%;
            font-size:1.15rem;
            font-weight:bold;
            margin-bottom:5px;
        }

        button{
            flex:1;
            min-width:130px;

            padding:12px;
            border:none;
            border-radius:10px;

            background:#f4ecf0;
            color:#333;

            cursor:pointer;
            transition:.2s;
            font-size:0.95rem;
        }

        button:hover{
            background:#f5dfe8;
            transform:translateY(-2px);
        }

        button:active{
            transform:translateY(0);
        }

        button.selected{
            background:#f8c8dc;
            color:#333;
            font-weight:bold;
        }

        body>button{
            display:block;
            width:100%;
            margin:35px auto;

            background:#f8c8dc;
            color:#333;
            font-size:1.1rem;
            font-weight:bold;
            border-radius:14px;
            padding:16px;
        }

        body>button:hover{
            background:#f593bc;
        }

        #cache{
            background:white;
            border-radius:16px;
            padding:22px;
            text-align:center;
            font-size:1.35rem;
            font-weight:bold;
            box-shadow:0 6px 18px rgba(0,0,0,.08);
            margin-bottom:15px;
        }

        #cache0{
            background:white;
            border-radius:16px;
            padding:18px;
            box-shadow:0 6px 18px rgba(0,0,0,.08);
        }

        @media (max-width:700px){

            button{
                flex-basis:100%;
            }

            h1{
                font-size:1.8rem;
            }

        }
    </style>
</head>
<body>
    <h1>元素診断</h1>
    <h3>貴方によく似た元素を診断します</h3>
    <p>Ver : 8.1.0 </p>

    <div id="questions"></div>

    <button type="button" onclick="sindan()">診断</button>

    <p id="cache"></p>
    <p id="cache0"></p>

<script>

const v = 4, w = 3, x = 2.5, y = 2, z = 1;
const hy = 4, ly = 3, ln = 2, hn = 1;

const questions = [
    "気分屋だ",//三態
    "周りに流されやすい",//硬度
    "自分は珍しい人間だ",//稀少度
    "貯金は得意だ",//価値
    "メンタルは強いほうだ",//イオン化傾向
    "見た目には気を使っている"//綺麗
];

const choices = [
    ["凄くそう思う", v],
    ["そう思う　　", w],
    ["わからない　", x],
    ["そう思わない", y],
    ["全く思わない", z]
];

let counts = new Array(questions.length).fill(null);

const container = document.getElementById("questions");

questions.forEach((qText, qIndex) => {
    const block = document.createElement("div");
    block.className = "question-block";

    const label = document.createElement("div");
    label.className = "question-label";
    label.textContent = `Q${qIndex + 1}. ${qText}`;
    block.appendChild(label);

    choices.forEach(([choiceLabel, value]) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = choiceLabel;
        btn.addEventListener("click", () => {
            counts[qIndex] = value;
            block.querySelectorAll("button").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
        });
        block.appendChild(btn);
    });

    container.appendChild(block);
});

const data = [
    [hy, hy, hy, hn, ly, ln, 'H', '1', '水素', '宇宙で最も多く存在する、軽くて自由な元素。状況に応じてすぐ姿(気体・液体・固体)を変える、フットワークの軽いタイプ。',0],
    [hn, ln, ln, ln, hy, hy , 'C', '6', '炭素', 'ダイヤモンドにも黒鉛にもなる、同じ中身でも見せ方次第で全く違う顔を持つ元素。生命を支える縁の下の力持ち。',0],
    [hy, hy, hy, hn, hy, ly, 'N', '7', '窒素', '空気の約8割を占めるのに普段は目立たない、安定した芯を持つタイプ。実はとても身近で欠かせない存在。',0],
    [hy, hy, ly, hn, hy, ln,  'O', '8', '酸素', '生命に不可欠なエネルギッシュな元素。誰とでも結びつきやすく、周囲を活気づける社交的な存在。',0],

    [hy, hy, ln, ln, hn, hn, 'F', '9', 'フッ素', '全元素中トップクラスの反応性を誇る、情熱的で一度決めたら一直線なタイプ。',0],
    [ln, ln, ln, ln, hn, hn, 'Na', '11', 'ナトリウム', '単体では不安定だが、水と出会うと激しく反応する。仲間(化合物)になると塩のように生活に欠かせない存在になる。',0],
    [ln, hn, ly, hn, ln, ly, 'Al', '13', 'アルミニウム', '軽くて丈夫、加工もしやすく幅広く活躍する万能型。柔軟性と実用性を兼ね備えたタイプ。',0],
    [ln, ln, hy, hn, hy, ly, 'P', '15', 'リン', 'DNAや生命のエネルギー(ATP)に欠かせない縁の下の存在。地味に見えて実は超重要な役割を担うタイプ。',0],

    [hn, ln, ly, ln, hn, hn, 'Ca', '20', 'カルシウム', '骨や殻をつくる、しっかりとした土台になる元素。周囲を支える頼れる存在。',0],
    [hn, hn, hy, ly, ln, ln, 'Fe', '26', '鉄', '硬く丈夫で、古くから文明を支えてきた実用的な金属。真面目で信頼される働き者タイプ。',0],
    [hn, hn, hn, hn, ly, ly, 'Cu', '29', '銅', '電気を通しやすく抗菌性もある。柔軟な発想と実行力を兼ね備えた、縁の下のリーダー気質。',0],
    [hn, ln, ln, ly, ly, ly, 'Ag', '47', '銀', '美しい光沢と、金属中No.1の電気伝導率を誇る。センスが良く、周囲から一目置かれる存在。',3],

    [hn, hn, hn, ly, ly, hy, 'Pt', '78', '白金', '非常に希少で反応しにくい高貴な金属。落ち着いていて揺るがない、気品あるタイプ。',0],
    [hn, ly, hn, hy, ly, hy, 'Au', '79', '金', '錆びず変色しない、価値ある貴金属の代表格。自分の魅力に自信を持つ、華やかなタイプ。',0],
    [ly, ly, hn, ln, ly, ly, 'Hg', '80', '水銀', '常温で液体という珍しい金属。つかみどころがなく、状況に応じて自在に形を変える柔軟な性格。',4],
    [ln, hy, hy, hy, hn, hy, 'Bi', '83', 'ビスマス', '結晶が虹色に輝く、意外性のある元素。見た目のインパクトと個性が光る唯一無二の存在。',0]
];

function sindan() {
    if (counts.includes(null)) {
        document.getElementById("cache").textContent = "すべての質問に答えてください";
        document.getElementById("cache0").textContent = "";
        return;
    }

    if (counts.every(c => c === x)) {
        document.getElementById("cache").textContent = `原子番号97, 元素記号Bk, バークリウム`;
        document.getElementById("cache0").textContent = `人工的にしか作れない超希少元素。誰とも被らない、圧倒的にレアな存在。`;
        return;
    }

    let sums = [];

    for (let dt of data) {
        let sum = (dt[0] - counts[0])**2 + (dt[1] - counts[1])**2 + (dt[2] - counts[2])**2
                + (dt[3] - counts[3])**2 + (dt[4] - counts[4])**2 + (dt[5] - counts[5])**2
                + dt[10];
        sums.push(sum);
    }

    const min = Math.min(...sums);
    const ans = sums.indexOf(min);

    document.getElementById("cache").textContent = `原子番号${data[ans][7]}, 元素記号${data[ans][6]}, ${data[ans][8]}`;
    document.getElementById("cache0").textContent = `${data[ans][9]}`;
}
</script>
</body>
</html>
